{{- if .Values.networkPolicy.enabled }}
# The usage collector (service.usagePort, 5514/TCP) and the firewall event collector (5515/UDP) accept data only
# from BNK's TMM; the API (8080) only from the
# portal / API gateway that fronts it (selectors from values).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: {app: bnk-inference-adapter, app.kubernetes.io/instance: {{ .Release.Name }}}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.tmmSelfIPs }}
        - ipBlock: {cidr: {{ . }}}
        {{- end }}
        {{- with .Values.networkPolicy.tmmPods }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports: [{port: {{ .Values.service.usagePort }}, protocol: TCP},
              {port: {{ .Values.service.firewallEventsPort }}, protocol: UDP}]
    - from: {{- toYaml .Values.networkPolicy.apiClients | nindent 8 }}
      ports: [{port: 8080, protocol: TCP}]
{{- end }}
